<main class="detail">
  <header class="hero">
    <p class="eyebrow">WECOM CLI</p>
    <h1>把企业协作放进对话</h1>
    <p class="lead">通过企业微信官方 CLI 连接消息、通讯录、文档、智能表格、待办、会议与日程，让查询和执行保持在同一条工作流里。</p>
    <div class="facts"><span>官方 CLI</span><span>本机加密凭据</span><span>写操作先确认</span></div>
  </header>
  <section><p class="index">01 / 功能</p><div class="grid">
    <article><b>消息与通讯录</b><p>查询可见成员、定位联系人、读取会话信息并在确认后发送消息。</p></article>
    <article><b>文档与智能表格</b><p>创建、读取和更新协作文档，维护智能表格字段与记录。</p></article>
    <article><b>日程与执行</b><p>管理待办、日程和预约会议，串联人员、时间与后续行动。</p></article>
  </div></section>
  <section><p class="index">02 / 使用场景</p><div class="scenarios">
    <blockquote>“查找支付项目组成员，并整理可联系名单。”</blockquote>
    <blockquote>“根据本周进展创建企业微信周报文档。”</blockquote>
    <blockquote>“安排一次项目复盘会议，执行前先确认时间和参会人。”</blockquote>
  </div></section>
</main>
